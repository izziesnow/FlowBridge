[project]
name = "flowbridge"
version = "0.1.0"
description = "Web-based information management system for IT project communication and approval workflows"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # WhiteNoise warns that collectstatic has not been run; tests do not need collected files.
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
