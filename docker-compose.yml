services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: flowbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbridge -d flowbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: flowbridge
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PRIVATE_MEDIA_ROOT: /app/private_media
    ports:
      - "8000:8000"
    volumes:
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    # Runs the overdue-reminder job every 15 minutes (Section 3.3, "Scheduler").
    build: .
    command: ["sh", "-c", "while true; do python manage.py send_reminders; sleep 900; done"]
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-not-for-production
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: flowbridge
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  private_media:
