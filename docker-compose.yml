services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: flowbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbridge -d flowbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: flowbridge
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PRIVATE_MEDIA_ROOT: /app/private_media
    ports:
      - "8000:8000"
    volumes:
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  private_media:
