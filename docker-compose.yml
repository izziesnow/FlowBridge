# Flowbridge production-like stack (Sections 2.3.3 and 3.3).
#   docker compose up --build -d
#   docker compose exec web python manage.py seed_demo
#   open https://localhost:8443  (self-signed certificate unless you mount your own)
#
# Values below are for a local demonstration. For any shared server, put real
# secrets in a .env file next to this one; Compose reads it automatically.

x-app-env: &app-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-only-change-this-secret-key-before-sharing}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
  SITE_URL: ${SITE_URL:-https://localhost:8443}
  POSTGRES_DB: flowbridge
  POSTGRES_USER: flowbridge
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowbridge}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  PRIVATE_MEDIA_ROOT: /app/private_media
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowbridge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbridge -d flowbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment: *app-env
    volumes:
      - private_media:/app/private_media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    build: docker/nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - static:/app/staticfiles:ro
      - certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    # Overdue reminders and email retries every 15 minutes (Section 3.3, "Scheduler").
    build: .
    command: ["sh", "-c", "while true; do python manage.py send_reminders; python manage.py send_emails; sleep 900; done"]
    environment: *app-env
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  backup:
    # Daily database and document backup, kept for 14 days (NFR08). Restore steps: docs/operations.md.
    image: postgres:16
    command: ["sh", "-c", "while true; do /scripts/backup.sh; sleep 86400; done"]
    environment:
      PGHOST: db
      PGUSER: flowbridge
      PGPASSWORD: ${POSTGRES_PASSWORD:-flowbridge}
      PGDATABASE: flowbridge
      PRIVATE_MEDIA_ROOT: /media
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
    volumes:
      - ./scripts:/scripts:ro
      - private_media:/media
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  private_media:
  static:
  certs:
