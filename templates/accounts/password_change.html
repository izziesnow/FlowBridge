{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <h1 class="h4 mb-3">Change your password</h1>
    <form method="post" class="card card-body">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-control{% if field.errors %} is-invalid{% endif %}" autocomplete="{% if forloop.first %}current-password{% else %}new-password{% endif %}">
          {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
