{% extends "base.html" %}
{% block title %}New project{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-7">
  <h1 class="h4">New project</h1>
  <form method="post" class="card card-body">
    {% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Create project</button>
      <a class="btn btn-outline-secondary" href="{% url 'projects:list' %}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
