<div class="mb-3">
  {% if field.field.widget.input_type == "radio" %}
    <fieldset>
      <legend class="form-label fs-6">{{ field.label }}</legend>
      {% for choice in field %}
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="{{ field.html_name }}" value="{{ choice.data.value }}" id="{{ choice.id_for_label }}"{% if choice.data.selected %} checked{% endif %} required>
          <label class="form-check-label" for="{{ choice.id_for_label }}">{{ choice.choice_label }}</label>
        </div>
      {% endfor %}
    </fieldset>
  {% else %}
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if not field.field.required %} <span class="text-muted small">(optional)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
</div>
