<form method="get" class="card card-body mb-3" role="search" aria-label="Filter requests">
  <div class="row g-2 align-items-end">
    {% for field in filter_form %}
      {% if field.name == "overdue" %}
        <div class="col-6 col-md-2">
          <div class="form-check mb-1">{{ field }} <label class="form-check-label small" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
        </div>
      {% else %}
        <div class="col-6 {% if field.name == 'q' %}col-md-4{% else %}col-md-2{% endif %}">
          <label for="{{ field.id_for_label }}" class="form-label small mb-1">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endfor %}
    <div class="col-12 col-md-auto d-flex gap-2">
      <button type="submit" class="btn btn-sm btn-primary">Apply filters</button>
      <a class="btn btn-sm btn-outline-secondary" href="{{ request.path }}">Clear</a>
    </div>
  </div>
</form>
