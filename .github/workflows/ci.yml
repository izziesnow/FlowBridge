name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowbridge
          POSTGRES_USER: flowbridge
          POSTGRES_PASSWORD: flowbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowbridge -d flowbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowbridge
      POSTGRES_PASSWORD: flowbridge
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Deployment security checks (production settings)
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-deploy-check-${{ github.run_id }}-a-long-random-looking-value-for-the-check
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  e2e:
    # Browser journeys for the evaluation tasks and the WCAG 2.2 AA accessibility scan (NFR07).
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowbridge
          POSTGRES_USER: flowbridge
          POSTGRES_PASSWORD: flowbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowbridge -d flowbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies and the browser
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: pytest e2e -v
      - name: Keep the accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-reports
          path: e2e-reports/

  compose-smoke:
    # Brings up the full stack (PostgreSQL, Gunicorn, Nginx with HTTPS, scheduler, backup)
    # and runs a backup-and-restore test against it (NFR08).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300 db web nginx

      - name: HTTPS, redirects and security headers
        run: |
          set -eux
          test "$(curl -sk https://localhost:8443/healthz)" = "ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/accounts/login/)" = "301"
          curl -sk -D headers.txt -o /dev/null https://localhost:8443/accounts/login/
          grep -i "^HTTP/.* 200" headers.txt
          grep -i "^strict-transport-security" headers.txt
          grep -i "^content-security-policy" headers.txt
          grep -i "^x-frame-options: DENY" headers.txt
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/static/css/app.css)" = "200"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/documents/1/download/)" = "302"

      - name: Load demo data and check integrity
        run: |
          docker compose exec -T web python manage.py seed_demo
          docker compose exec -T web python manage.py send_reminders
          docker compose exec -T web python manage.py verify_integrity

      - name: Backup, simulate data loss, restore, verify
        run: |
          set -eux
          docker compose run --rm --no-deps -T backup /scripts/backup.sh
          BACKUP=$(ls -d backups/flowbridge-* | head -1)
          docker compose exec -T web python manage.py flush --no-input
          docker compose stop web
          docker compose run --rm --no-deps -T backup /scripts/restore.sh "/backups/$(basename "$BACKUP")"
          docker compose start web
          docker compose up --detach --wait --wait-timeout 120 web
          docker compose exec -T web python manage.py verify_integrity
          test "$(docker compose exec -T db psql -U flowbridge -Atc 'select count(*) from approvals_approvalrequest')" = "6"

      - name: Load the evaluation dataset
        run: docker compose exec -T web python manage.py generate_evaluation_data --load --flush --out /tmp/eval

      - name: Load test (NFR05, 20 users for 3 minutes through Nginx)
        run: |
          pip install "locust>=2.20"
          mkdir -p loadtest/results
          locust -f loadtest/locustfile.py --host https://localhost:8443 --headless -u 20 -r 5 -t 3m \
            --csv loadtest/results/ci --html loadtest/results/report.html --only-summary
          python loadtest/check_results.py loadtest/results/ci_stats.csv

      - name: Keep the load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test
          path: loadtest/results/

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
